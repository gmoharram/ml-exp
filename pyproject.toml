[project]
name = "ml-exp"
version = "0.1.0"
description = "Easy Setup for Flexible ML Experimentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.1",
    "medmnist>=3.0.2",
    "opt-einsum>=3.4.0",
    "pytorch-lightning>=2.5.0.post0",
    "tabulate>=0.9.0",
    "timm>=1.0.15",
    "torch>=2.6.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "wandb>=0.19.7",
    "wilds>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ml_exp"]
package-dir = {"" = "src"}
